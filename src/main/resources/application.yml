spring:
  application:
    name: TaskTrackerBackend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
springdoc:
  swagger-ui:
    path: /api/docs
    url: /openapi.yml
jwt:
  secret: ${JWT_SECRET}
  expiration-sec: 3600
