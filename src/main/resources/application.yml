spring:
  profiles:
    active: dev
  application:
    name: TaskTrackerBackend
  datasource:
    url: jdbc:postgresql://localhost:5432/task_tracker
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
springdoc:
  swagger-ui:
    path: /api/docs
    url: /openapi.yml
jwt:
  secret: secret
  expiration-sec: 3600
